targets:
  $default:
    builders:
      json_serializable:
        options:
          # Oggetti annidati (es. SkippedStep) convertiti anche loro in mappe.
          explicit_to_json: true
      drift_dev:
        options:
          # Date in ISO-8601 con millisecondi, leggibili nel file (D-18).
          store_date_time_values_as_text: true
          # Schema salvato e test di migrazione: `dart run drift_dev make-migrations` (D-19).
          databases:
            irenefy: lib/data/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
